events {
    worker_connections 1024;
}

http {
    server {
        listen 80;

        location / {
            return 200 'API Gateway is running!';
            add_header Content-Type text/plain;
        }

        # Example routing for your microservices:
        # location /api/users/ {
        #     proxy_pass http://user_service:3000/;
        # }
    }
}