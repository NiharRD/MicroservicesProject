_format_version: "3.0"
_transform: true

services:
  - name: user-service
    url: http://user_service:3000/v1 # Points to the container name in docker-compose , IMP IMP IMP
    routes:
      - name: user-routes
        paths:
          - /api/users
        strip_path: true
    plugins:
      - name: rate-limiting
        config:
          minute: 15 # max 5 requests per minute
          policy: local
          fault_tolerant: true
          hide_client_headers: false # Sends headers back to the client showing their remaining quota
  - name: payment_service
    url: http://payment_service:4000 # Points to the container name in docker-compose , IMP IMP IMP
    routes:
      - name: payment_service-health-check
        paths:
          - /api/payment
        strip_path: false
        plugins:
          - name: rate-limiting
            config:
              minute: 4
              policy: local
              fault_tolerant: true
              hide_client_headers: false
      - name: payment_service-checkout
        paths:
          - /api/payment/checkout
        strip_path: false
        methods:
          - POST
        plugins:
          # Phase 1: Authentication (Validates signature and expiration)
          - name: jwt
            config:
              claims_to_verify:
                - exp
          - name: rate-limiting
            config:
              minute: 50 # max 50 requests per minute
              policy: local
              fault_tolerant: true
              hide_client_headers: false # Sends headers back to the client showing their remaining quota
          # Phase 2: Authorization (Decodes trusted token and checks role)
          - name: pre-function
            config:
              access:
                - |
                  local auth_header = kong.request.get_header('Authorization')
                  if not auth_header then 
                    return kong.response.exit(401, { error = 'Missing Authorization header' }) 
                  end

                  local token = auth_header:gsub('Bearer ', '')
                  local _, payload_b64, _ = token:match("([^%.]+)%.([^%.]+)%.([^%.]+)")

                  if not payload_b64 then
                    return kong.response.exit(400, { error = 'Malformed JWT' }) 
                  end

                  -- Pad the base64 string
                  local remainder = #payload_b64 % 4
                  if remainder > 0 then
                    payload_b64 = payload_b64 .. string.rep("=", 4 - remainder)
                  end

                  -- Replace URL-safe characters
                  payload_b64 = payload_b64:gsub("-", "+"):gsub("_", "/")

                  local payload_str = ngx.decode_base64(payload_b64)
                  if not payload_str then
                    return kong.response.exit(400, { error = 'Malformed JWT Payload' })
                  end

                  -- Check for userId match on POST requests
                  if kong.request.get_method() == "POST" then
                    -- Get the parsed body parameters
                    local body, err = kong.request.get_body()
                    
                    -- Proceed only if we successfully parsed the body and it contains 'userId'
                    if body and body.userId then
                      local req_user_id = tostring(body.userId)
                      
                      -- Extract "id" from payload using native string matching (Kong sandbox safe)
                      -- First try matching a string id (e.g., "id": "123")
                      local token_id = string.match(payload_str, '"id"%s*:%s*"([^"]+)"')
                      if not token_id then
                        -- Fallback to matching a numeric/unquoted id (e.g., "id": 123)
                        token_id = string.match(payload_str, '"id"%s*:%s*([%w%-]+)')
                      end
                      
                      -- If the token doesn't have an id, or it doesn't match the request userId
                      if not token_id then
                        return kong.response.exit(403, { error = 'Forbidden: JWT missing id claim' })
                      elseif tostring(token_id) ~= req_user_id then
                        return kong.response.exit(403, { error = 'Forbidden: userId does not match token id' })
                      end
                    end
                  end

      - name: payment_service-webhook-route
        paths:
          - /api/payment/webhook
        strip_path: false
        methods:
          - POST
          ## hehe , here no rate limiting is applied because this route is called by the payment gateway and not by the user
  - name: catalog_service
    url: http://catalog_service:9000 # Points to the container name in docker-compose , IMP IMP IMP
    routes:
      - name: drink-public-routes
        paths:
          - /api/drinks
        strip_path: false
        methods:
          - GET
      - name: drink-private-routes
        paths:
          - /api/drinks
        strip_path: false
        methods:
          - POST
        plugins:
          # Phase 1: Authentication (Validates signature and expiration)
          - name: jwt
            config:
              claims_to_verify:
                - exp
          - name: rate-limiting
            config:
              minute: 50 # max 50 requests per minute
              policy: local
              fault_tolerant: true
              hide_client_headers: false # Sends headers back to the client showing their remaining quota
          # Phase 2: Authorization (Decodes trusted token and checks role)
          - name: pre-function
            config:
              access:
                - |
                  local auth_header = kong.request.get_header('Authorization')
                  if not auth_header then 
                    return kong.response.exit(401, { error = 'Missing Authorization header' }) 
                  end

                  local token = auth_header:gsub('Bearer ', '')
                  local _, payload_b64, _ = token:match("([^%.]+)%.([^%.]+)%.([^%.]+)")

                  if not payload_b64 then
                    return kong.response.exit(400, { error = 'Malformed JWT' }) 
                  end

                  -- Pad the base64 string
                  local remainder = #payload_b64 % 4
                  if remainder > 0 then
                      payload_b64 = payload_b64 .. string.rep("=", 4 - remainder)
                  end

                  -- Replace URL-safe characters
                  payload_b64 = payload_b64:gsub("-", "+"):gsub("_", "/")

                  local payload_str = ngx.decode_base64(payload_b64)
                  if not payload_str then
                    return kong.response.exit(400, { error = 'Malformed JWT Payload' })
                  end

                  -- Since 'cjson' and 'require' are blocked in the Kong sandbox,
                  -- we can just use native string matching to check the role claim.
                  if not string.match(payload_str, '"role"%s*:%s*"ADMIN"') then
                    return kong.response.exit(403, { error = 'Forbidden: Admin access required' })
                  end

consumers:
  # Represents your User Service that generates the tokens
  - username: user-service
    jwt_secrets:
      # The 'key' must match the 'iss' (issuer) claim in the JWT payload
      - key: user-service-issuer
        secret: jwt_secret
        algorithm: HS256

# In Kong API Gateway, strip_path controls whether Kong should remove the part of the URL it matched before sending the request to your backend service.

# Think of it as a receptionist forwarding a phone call. If an outside caller asks for "Department API, Extension Checkout", does the receptionist just send "Checkout" to the backend, or the whole phrase "Department API, Extension Checkout"?

# Here is exactly how it behaves in practice.

# Scenario A: strip_path: true (Common Setup)
# If your Kong route is set to match /api/payment and strip_path is true, Kong chops off /api/payment before forwarding the request.

# Client calls Kong: http://kong:8000/api/payment/checkout

# Kong matches: /api/payment

# Kong strips it out.

# Your Node/Go app receives: /checkout

# Requirement: Your backend application code must be listening on the endpoint /checkout.

# Scenario B: strip_path: false
# If you set it to false, Kong passes the entire URL exactly as the client typed it to your backend.

# Client calls Kong: http://kong:8000/api/payment/checkout

# Kong matches: /api/payment

# Kong strips: Nothing.

# Your Node/Go app receives: /api/payment/checkout

# Requirement: Your backend application code must be listening on the full endpoint /api/payment/checkout.
